services:
  devcontainer:
    hostname: ${DEVCONTAINER_HOST_NAME}
    container_name: ${DEVCONTAINER_CONTAINER_NAME}
    image: ${DEVCONTAINER_IMAGE_NAME}
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - type: bind
        source: ${LOCAL_WORKSPACE_FOLDER:-./../}
        target: /workspace
        consistency: cached
    environment:
      - DISPLAY=host.docker.internal:0
      - LIBGL_ALWAYS_SOFTWARE=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${HOST_IP}:${DEVCONTAINER_HOST_PORT}:8000
    tty: true
